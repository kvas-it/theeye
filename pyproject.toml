[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theeye"
version = "0.1.0"
description = "Web information aggregator with AI-generated summaries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "feedparser>=6.0",
    "httpx>=0.27",
    "readability-lxml>=0.8",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx",  # for FastAPI TestClient
]

[project.scripts]
theeye = "theeye.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["theeye*"]
